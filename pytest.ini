[pytest]
# The `_extract/` directory contains unzipped copies of the submission zips,
# including a second tests/test_carbon_calculator.py. Two test modules with the
# same basename in different directories break pytest's default import mode, so
# the extracted copies are excluded from collection here. The real suite lives
# at the project root and in tests/.
norecursedirs =
    _extract
    venv
    .git
    __pycache__
    frontend
    node_modules
    dist

testpaths =
    .
